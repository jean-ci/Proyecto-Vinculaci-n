services:
  db:
    image: postgres:16-alpine
    container_name: proyectos-uta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: proyectos_uta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proyectos_uta"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    container_name: proyectos-uta-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
